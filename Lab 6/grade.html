<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Grade Calculator</title>
    <!-- Link external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Student Grade Calculator</h2>

        <!-- Form with 'return' so page does not reload on submit -->
        <form name="gradeForm" onsubmit="return checkMark()">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>

            <label for="mark">Mark (0-100): </label>
            <input type="text" id="mark" name="mark"><br><br>

            <button type="submit">Check Grade</button>
            <!-- Extension: Random Mark button (type="button" prevents form submission) -->
            <button type="button" onclick="generateRandomMark()">Random Mark</button>
        </form>

        <!-- Result and Date display -->
        <p id="result"></p>
        <p id="checkedDate"></p>

        <hr>

        <!-- Fixed function name capitalization: showTable() -->
        <button onclick="showTable()">Show Grade Table</button>
        <div id="tableContainer"></div>
    </div>

    <!-- Fixed filename from grades.js to grade.js -->
    <script src="grade.js"></script>
</body>
</html>
